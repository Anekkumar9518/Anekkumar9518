<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="270" viewBox="0 0 1000 270" role="img" aria-labelledby="t d">
  <title id="t">Real results by Anek Kumar</title>
  <desc id="d">Number 1 on Google for 17 keywords, 1.22 million Google impressions in 6 months, 1,149 Meta Ads property leads at 288 rupees each.</desc>
  <style>
    .bg { fill: #0d0d0c; }
    .frame { fill: none; stroke: #2b2a27; }
    .k { font: 600 13px "Segoe UI", -apple-system, Helvetica, Arial, sans-serif; fill: #8f8c84; letter-spacing: .08em; }
    .big { font: 800 64px "Segoe UI", -apple-system, Helvetica, Arial, sans-serif; fill: #f1f0ec; letter-spacing: -2px; }
    .big.o { fill: #ff7a45; }
    .lab { font: 500 16px "Segoe UI", -apple-system, Helvetica, Arial, sans-serif; fill: #c9c6bd; }
    .sub { font: 400 13px Consolas, Menlo, "Courier New", monospace; fill: #7f7c74; }
    .sep { stroke: #2b2a27; }
    .bar { fill: #2b2a27; }
    .fill { fill: #e2571f; transform-box: fill-box; transform-origin: left center; transform: scaleX(0); animation: grow 1.6s cubic-bezier(.2, .8, .2, 1) forwards; }
    .col { opacity: 0; animation: up .8s cubic-bezier(.2, .8, .2, 1) forwards; }
    .c2 { animation-delay: .25s; } .c3 { animation-delay: .5s; }
    .f2 { animation-delay: .45s; } .f3 { animation-delay: .7s; }
    .dot { fill: #4be37a; animation: pulse 1.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes up { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    @keyframes grow { to { transform: scaleX(1); } }
    @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .35; transform: scale(.7); } }
  </style>
  <rect class="bg" x="0.5" y="0.5" width="999" height="269" rx="18"/>
  <rect class="frame" x="0.5" y="0.5" width="999" height="269" rx="18"/>

  <circle class="dot" cx="36" cy="36" r="5"/>
  <text class="k" x="50" y="41">REAL RESULTS · SHUBHARAMBH INFRA ADVISORS · 2026</text>
  <text class="sub" x="964" y="41" text-anchor="end">Search Console · Meta Ads Manager</text>

  <g class="col">
    <text class="big o" x="36" y="132">#1</text>
    <text class="lab" x="36" y="164">on Google for 17 keywords</text>
    <rect class="bar" x="36" y="190" width="280" height="6" rx="3"/>
    <rect class="fill" x="36" y="190" width="280" height="6" rx="3"/>
    <text class="sub" x="36" y="226">"best property advisor in noida"</text>
  </g>
  <line class="sep" x1="350" y1="76" x2="350" y2="236"/>
  <g class="col c2">
    <text class="big" x="380" y="132">1.22M</text>
    <text class="lab" x="380" y="164">Google impressions in 6 months</text>
    <rect class="bar" x="380" y="190" width="270" height="6" rx="3"/>
    <rect class="fill f2" x="380" y="190" width="270" height="6" rx="3"/>
    <text class="sub" x="380" y="226">up from 3.43k · 355×</text>
  </g>
  <line class="sep" x1="684" y1="76" x2="684" y2="236"/>
  <g class="col c3">
    <text class="big" x="714" y="132">1,149</text>
    <text class="lab" x="714" y="164">property leads from Meta Ads</text>
    <rect class="bar" x="714" y="190" width="250" height="6" rx="3"/>
    <rect class="fill f3" x="714" y="190" width="250" height="6" rx="3"/>
    <text class="sub" x="714" y="226">₹288 per lead · ~1 in 10 meet</text>
  </g>
</svg>

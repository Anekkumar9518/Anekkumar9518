# Draws the contribution "snake" and publishes it to the `output` branch,
# where the profile README reads it from. Runs daily and on demand.
name: Generate contribution snake

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate the snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#e2571f&color_dots=#ebedf0,#ffd9c7,#ffb08a,#ff7a45,#e2571f
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#ff7a45&color_dots=#161b22,#5a2a14,#8a3b17,#c2491a,#ff7a45

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

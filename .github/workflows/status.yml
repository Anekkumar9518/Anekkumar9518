# Checks the six live sites every morning (09:00 IST) and redraws the
# terminal in the editor card with the real status codes and response times.
name: Live site status

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: status
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install font tools
        run: pip install fonttools brotli pillow

      - name: Check the sites
        run: python tools/check_sites.py

      - name: Redraw the editor card
        run: python tools/build_svgs.py

      - name: Commit the new status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/status.json assets/editor.svg
          git diff --cached --quiet && exit 0
          git commit -m "Live status: $(date -u +'%d %b %Y')"
          git push
